# Config for U-Net/Mask R-CNN Segmentation
dataset:
  name: "CelebAMask-HQ"
  train_path: "data/celebamask_hq/train"
  val_path: "data/celebamask_hq/val"

model:
  name: "UNet" # or "MaskRCNN"
  backbone: "ResNet50"
  in_channels: 3
  out_channels: 1 # Binary mask for face

train:
  batch_size: 8
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 4
  device: "cuda" # or "cpu"
