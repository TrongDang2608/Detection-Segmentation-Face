# Config for RetinaFace Detection
dataset:
  name: "WIDER_FACE"
  train_path: "data/wider_face/train"
  val_path: "data/wider_face/val"

model:
  name: "RetinaFace"
  backbone: "ResNet50"

train:
  batch_size: 8
  epochs: 100
  lr: 0.001
  weight_decay: 0.0005
  num_workers: 4
  device: "cuda" # or "cpu"